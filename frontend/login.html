<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Brand eCommerce</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="top-bar">
  <div class="container">
    <a href="index.html" class="logo">
      <img src="assets/images/logo-colored.png" alt="Logo Image">
    </a>
  </div>
</header>

<!-- ===== LOGIN SECTION ===== -->
<main class="auth-page">
  <div class="auth-container">

    <!-- LEFT: Info -->
    <div class="auth-left">
      <h2>Welcome Back!</h2>
      <p>Login to access your account, track orders and manage your wishlist.</p>
      <div class="auth-features">
        <div class="auth-feature">
          <i class="fas fa-shopping-cart"></i>
          <span>Track your orders</span>
        </div>
        <div class="auth-feature">
          <i class="fas fa-heart"></i>
          <span>Save your wishlist</span>
        </div>
        <div class="auth-feature">
          <i class="fas fa-tag"></i>
          <span>Get exclusive deals</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Form -->
    <div class="auth-right">
      <div class="auth-card">
        <h3>Sign In</h3>
        <p class="auth-subtitle">Enter your credentials to continue</p>

        <div id="errorMsg" class="error-msg" style="display:none"></div>
        <div id="successMsg" class="success-msg" style="display:none"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="loginEmail" placeholder="Enter your email" required/>
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="loginPassword" placeholder="Enter your password" required/>
              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="loginBtn">
            <span>Sign In</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider"><span>OR</span></div>

        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html">Create Account</a>
        </p>

        <!-- Admin hint -->
        <div class="admin-hint">
          <i class="fas fa-shield-alt"></i>
          <span>Admin? Use your admin credentials</span>
        </div>
      </div>
    </div>

  </div>
</main>

<script>
const API_URL = 'http://127.0.0.1:8000/api';

async function handleLogin(e) {
  e.preventDefault();

  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  errorMsg.style.display   = 'none';
  successMsg.style.display = 'none';

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
  btn.disabled  = true;

  try {
    const res  = await fetch(`${API_URL}/auth/login`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      errorMsg.textContent   = data.detail || 'Invalid email or password';
      errorMsg.style.display = 'block';
      return;
    }

    // Token save karo
    localStorage.setItem('adminToken', data.access_token);
    localStorage.setItem('adminUser',  JSON.stringify(data.user));
    localStorage.setItem('userToken',  data.access_token);
    localStorage.setItem('user',       JSON.stringify(data.user));

    successMsg.textContent   = 'Login successful! Redirecting...';
    successMsg.style.display = 'block';

    // Admin → admin panel, User → home
    setTimeout(() => {
      if (data.user.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    }, 1000);

  } catch (err) {
    errorMsg.textContent   = 'Server error. Please try again!';
    errorMsg.style.display = 'block';
  } finally {
    btn.innerHTML = '<span>Sign In</span><i class="fas fa-arrow-right"></i>';
    btn.disabled  = false;
  }
}

function togglePassword(id) {
  const input   = document.getElementById(id);
  const icon    = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type      = 'text';
    icon.className  = 'fas fa-eye-slash';
  } else {
    input.type      = 'password';
    icon.className  = 'fas fa-eye';
  }
}
</script>
</body>
</html>
