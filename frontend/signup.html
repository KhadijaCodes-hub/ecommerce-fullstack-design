<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Brand eCommerce</title>
  <link rel="shortcut icon" href="assets/images/shop.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="top-bar">
  <div class="container">
    <a href="index.html" class="logo">
      <img src="assets/images/logo-colored.png" alt="Logo Image">
    </a>
  </div>
</header>

<!-- ===== SIGNUP SECTION ===== -->
<main class="auth-page">
  <div class="auth-container">

    <!-- LEFT: Info -->
    <div class="auth-left">
      <h2>Join Us Today!</h2>
      <p>Create your account and start shopping from thousands of products.</p>
      <div class="auth-features">
        <div class="auth-feature">
          <i class="fas fa-box"></i>
          <span>Access all products</span>
        </div>
        <div class="auth-feature">
          <i class="fas fa-shipping-fast"></i>
          <span>Fast delivery</span>
        </div>
        <div class="auth-feature">
          <i class="fas fa-shield-alt"></i>
          <span>Secure payments</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Form -->
    <div class="auth-right">
      <div class="auth-card">
        <h3>Create Account</h3>
        <p class="auth-subtitle">Fill in the details to get started</p>

        <div id="errorMsg" class="error-msg" style="display:none"></div>
        <div id="successMsg" class="success-msg" style="display:none"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-icon">
              <i class="fas fa-user"></i>
              <input type="text" id="signupName" placeholder="Enter your full name" required/>
            </div>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="signupEmail" placeholder="Enter your email" required/>
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="signupPassword" placeholder="Create a password" required/>
              <button type="button" class="toggle-password" onclick="togglePassword('signupPassword')">
                <i class="fas fa-eye" id="eyeIcon2"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="confirmPassword" placeholder="Confirm your password" required/>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="signupBtn">
            <span>Create Account</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider"><span>OR</span></div>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Sign In</a>
        </p>
      </div>
    </div>

  </div>
</main>

<script>
const API_URL = 'http://127.0.0.1:8000/api';

async function handleSignup(e) {
  e.preventDefault();

  const name     = document.getElementById('signupName').value.trim();
  const email    = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirm  = document.getElementById('confirmPassword').value;
  const btn      = document.getElementById('signupBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  errorMsg.style.display   = 'none';
  successMsg.style.display = 'none';

  if (password !== confirm) {
    errorMsg.textContent   = 'Passwords do not match!';
    errorMsg.style.display = 'block';
    return;
  }

  if (password.length < 6) {
    errorMsg.textContent   = 'Password must be at least 6 characters!';
    errorMsg.style.display = 'block';
    return;
  }

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
  btn.disabled  = true;

  try {
    const res  = await fetch(`${API_URL}/auth/register`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      errorMsg.textContent   = data.detail || 'Registration failed!';
      errorMsg.style.display = 'block';
      return;
    }

    successMsg.textContent   = 'Account created! Redirecting to login...';
    successMsg.style.display = 'block';

    setTimeout(() => window.location.href = 'login.html', 1500);

  } catch (err) {
    errorMsg.textContent   = 'Server error. Please try again!';
    errorMsg.style.display = 'block';
  } finally {
    btn.innerHTML = '<span>Create Account</span><i class="fas fa-arrow-right"></i>';
    btn.disabled  = false;
  }
}

function togglePassword(id) {
  const input  = document.getElementById(id);
  const iconId = id === 'signupPassword' ? 'eyeIcon2' : 'eyeIcon3';
  const icon   = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type     = 'text';
    if(icon) icon.className = 'fas fa-eye-slash';
  } else {
    input.type     = 'password';
    if(icon) icon.className = 'fas fa-eye';
  }
}
</script>
</body>
</html>
